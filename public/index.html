<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyxoria — The Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--void:#050407;--deep:#0d0b12;--crypt:#13101c;--veil:#1e1828;--ash:#2e2640;--mist:#4a3f60;--bone:#c8bfd8;--parchment:#e8dfc8;--blood:#8b1a2f;--crimson:#c41e3a;--rose:#e85d75;--gold:#c9a84c;--pale-gold:#e8d08a;--silver:#9b97b0;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--void);color:var(--bone);font-family:'Lora',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 45% at 50% -10%,rgba(139,26,47,.15) 0%,transparent 65%),
             radial-gradient(ellipse 50% 70% at 0% 70%,rgba(74,63,96,.15) 0%,transparent 55%);}

/* ── Header ── */
.site-header{position:relative;z-index:10;text-align:center;padding:4rem 1.5rem 2.8rem;border-bottom:1px solid var(--ash);background:linear-gradient(to bottom,var(--deep) 0%,transparent 100%);}
.hdr-rune{font-size:2rem;color:var(--blood);margin-bottom:.8rem;display:block;filter:drop-shadow(0 0 20px rgba(139,26,47,.55));animation:flicker 5s ease-in-out infinite;}
@keyframes flicker{0%,100%{opacity:1}46%{opacity:.6}50%{opacity:1}55%{opacity:.78}60%{opacity:1}}
.hdr-rule{height:1px;width:110px;margin:0 auto .9rem;background:linear-gradient(to right,transparent,var(--blood),transparent);}
.site-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(2.4rem,7vw,4rem);
  background:linear-gradient(165deg,#fff8e8 0%,var(--pale-gold) 40%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.03em;margin-bottom:.55rem;line-height:1.1;}
.site-tagline{font-family:'Lora',Georgia,serif;font-style:italic;color:var(--silver);font-size:1.05rem;letter-spacing:.03em;}
.hdr-divider{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1.4rem;font-size:.6rem;letter-spacing:.5em;text-transform:uppercase;color:var(--mist);}
.hdr-divider::before,.hdr-divider::after{content:'';width:55px;height:1px;background:var(--ash);}

/* ── Live indicator ── */
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blood);margin-right:.45rem;vertical-align:middle;animation:livepulse 2.5s ease-in-out infinite;}
@keyframes livepulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}

/* ── Controls ── */
.controls{position:relative;z-index:10;padding:1rem 1.5rem;border-bottom:1px solid var(--ash);background:var(--deep);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:140px;}
.search-wrap::before{content:'⊘';position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--mist);font-size:.85rem;pointer-events:none;}
.search{width:100%;background:var(--veil);border:1px solid var(--ash);border-bottom:2px solid var(--ash);color:var(--parchment);padding:.55rem .9rem .55rem 2.3rem;font-family:'Lora',Georgia,serif;font-size:.9rem;outline:none;transition:border-color .3s;}
.search:focus{border-bottom-color:var(--gold);}
.search::placeholder{color:var(--mist);}
.genre-sel{background:var(--veil);border:1px solid var(--ash);border-bottom:2px solid var(--ash);color:var(--silver);padding:.55rem .8rem;font-family:'Lora',Georgia,serif;font-size:.88rem;outline:none;cursor:pointer;transition:border-color .3s;}
.genre-sel:focus{border-bottom-color:var(--gold);}
.genre-sel option{background:var(--veil);}
.count{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mist);white-space:nowrap;}

/* ── Tag filter bar ── */
.tag-bar{position:relative;z-index:10;padding:.65rem 1.5rem;border-bottom:1px solid var(--ash);background:var(--deep);display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;min-height:2.8rem;}
.tag-bar-label{font-size:.58rem;letter-spacing:.38em;text-transform:uppercase;color:var(--mist);margin-right:.2rem;white-space:nowrap;}
.tag-pill{display:inline-flex;align-items:center;padding:.28rem .72rem;font-size:.72rem;border:1px solid var(--ash);color:var(--silver);cursor:pointer;background:transparent;font-family:'Lora',Georgia,serif;transition:all .2s;border-radius:2px;}
.tag-pill:hover{border-color:var(--mist);color:var(--bone);}
.tag-pill.active{background:rgba(139,26,47,.18);border-color:var(--blood);color:var(--rose);}
.tag-bar-empty{font-size:.75rem;color:var(--mist);font-style:italic;}

/* ── Grid ── */
.archive{position:relative;z-index:10;max-width:1200px;margin:0 auto;padding:2rem 1.5rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(175px,100%),1fr));gap:1.4rem;}

.card{background:var(--crypt);border:1px solid var(--ash);border-top:2px solid var(--blood);display:flex;flex-direction:column;cursor:pointer;color:inherit;overflow:hidden;
  transition:transform .35s cubic-bezier(.23,1.12,.62,1),border-color .3s,box-shadow .3s;
  animation:cardUp .5s ease both;}
@keyframes cardUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-6px);border-color:var(--mist);box-shadow:0 14px 45px rgba(0,0,0,.65);}
.card-cover{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;filter:sepia(12%) brightness(.9);transition:filter .4s;}
.card:hover .card-cover{filter:sepia(4%) brightness(1);}
.card-ph{width:100%;aspect-ratio:2/3;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;color:var(--blood);font-size:2.2rem;border-bottom:1px solid var(--ash);}
.card-ph span{font-size:.52rem;letter-spacing:.38em;text-transform:uppercase;color:var(--mist);}
.card-body{padding:.75rem;flex:1;display:flex;flex-direction:column;gap:.22rem;}
.card-genre{font-size:.54rem;letter-spacing:.4em;text-transform:uppercase;color:var(--rose);}
.card-title{font-family:'Playfair Display',Georgia,serif;font-size:.78rem;line-height:1.35;color:var(--parchment);flex:1;}
.card-tags{display:flex;flex-wrap:wrap;gap:.28rem;margin-top:.3rem;}
.card-tag{font-size:.58rem;padding:.18rem .48rem;border:1px solid rgba(139,26,47,.4);color:var(--mist);letter-spacing:.02em;}
.card-meta{font-size:.64rem;color:var(--mist);font-style:italic;}
.card-cta{display:block;margin:.5rem -.75rem -.75rem;padding:.52rem .75rem;background:rgba(139,26,47,.12);border-top:1px solid var(--ash);font-size:.58rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);text-align:center;transition:background .3s;}
.card:hover .card-cta{background:rgba(139,26,47,.25);}

/* ── States ── */
.state{text-align:center;padding:5rem 1rem;}
.state-rune{font-size:3rem;color:var(--blood);display:block;margin-bottom:1.1rem;}
.spinning{animation:spin 2.5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.state-msg{color:var(--mist);font-style:italic;}
.state-msg.err{color:var(--rose);}
.retry{display:inline-block;margin-top:1.2rem;color:var(--gold);font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;cursor:pointer;background:none;border:none;font-family:'Lora',Georgia,serif;}

/* ── Modal overlay ── */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(5,4,7,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{position:relative;width:min(520px,100%);max-height:90svh;background:linear-gradient(160deg,var(--deep) 0%,#0a0910 100%);border:1px solid var(--ash);border-top:2px solid var(--blood);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.8);transform:translateY(22px) scale(.97);transition:transform .28s cubic-bezier(.23,1.12,.62,1);}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-corner{position:absolute;width:14px;height:14px;border-color:rgba(201,168,76,.2);border-style:solid;}
.modal-corner.tl{top:-1px;left:-1px;border-width:2px 0 0 2px;}.modal-corner.tr{top:-1px;right:-1px;border-width:2px 2px 0 0;}.modal-corner.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}.modal-corner.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
.modal-close{position:absolute;top:.7rem;right:.7rem;background:none;border:none;color:var(--mist);font-size:1.1rem;cursor:pointer;line-height:1;padding:.2rem .4rem;transition:color .2s;}
.modal-close:hover{color:var(--rose);}

.modal-head{display:flex;gap:1rem;padding:1.1rem;border-bottom:1px solid var(--ash);flex-shrink:0;}
.modal-cover-wrap{flex-shrink:0;width:68px;}
.modal-cover-wrap img,.modal-cover-ph{width:68px;height:102px;object-fit:cover;display:block;border:1px solid var(--ash);}
.modal-cover-ph{background:var(--veil);display:flex;align-items:center;justify-content:center;color:var(--blood);font-size:1.4rem;}
.modal-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem;padding-top:.1rem;padding-right:1.6rem;}
.modal-genre{font-size:.52rem;letter-spacing:.4em;text-transform:uppercase;color:var(--rose);}
.modal-title{font-family:'Playfair Display',Georgia,serif;font-size:.95rem;line-height:1.3;color:var(--parchment);}
.modal-meta{font-size:.7rem;color:var(--mist);font-style:italic;}
.modal-published{font-size:.66rem;color:var(--silver);margin-top:.1rem;}
.modal-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;}
.modal-tag{font-size:.62rem;padding:.2rem .52rem;border:1px solid rgba(139,26,47,.5);color:var(--rose);letter-spacing:.02em;cursor:pointer;transition:background .2s;}
.modal-tag:hover{background:rgba(139,26,47,.15);}

.modal-summary{font-size:.88rem;line-height:1.75;color:var(--silver);font-style:italic;padding:.9rem 1.1rem;border-bottom:1px solid var(--ash);flex-shrink:0;}
.modal-body{overflow-y:auto;flex:1;padding:1rem 1.1rem 1.1rem;}
.chap-label{font-size:.56rem;letter-spacing:.45em;text-transform:uppercase;color:var(--mist);margin-bottom:.65rem;}
.chap-list{display:flex;flex-direction:column;gap:.28rem;}
.chap-item{display:flex;align-items:center;gap:.75rem;padding:.58rem .75rem;background:rgba(30,24,40,.6);border:1px solid var(--ash);border-left:2px solid transparent;text-decoration:none;color:var(--bone);transition:border-color .2s,background .2s;}
.chap-item:hover{border-left-color:var(--blood);background:rgba(46,38,64,.5);color:var(--parchment);}
.chap-num{font-size:.56rem;letter-spacing:.3em;color:var(--mist);min-width:1.8rem;font-style:italic;}
.chap-title{font-size:.84rem;flex:1;}
.chap-arrow{color:var(--gold);font-size:.75rem;opacity:0;transition:opacity .2s;}
.chap-item:hover .chap-arrow{opacity:1;}
.modal-no-chap{font-style:italic;color:var(--mist);font-size:.85rem;padding:.5rem 0;}

/* ── Footer ── */
.site-footer{position:relative;z-index:10;border-top:1px solid var(--ash);padding:2rem 1.5rem;text-align:center;color:var(--mist);font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;}
.footer-rune{font-size:.95rem;color:var(--blood);margin-bottom:.5rem;display:block;}
.site-footer a{color:var(--mist);text-decoration:none;transition:color .3s;}
.site-footer a:hover{color:var(--gold);}
@media(max-width:600px){.controls{padding:.8rem 1rem;}.tag-bar{padding:.6rem 1rem;}}
</style>
</head>
<body>

<header class="site-header">
  <span class="hdr-rune">⸸</span>
  <div class="hdr-rule"></div>
  <h1 class="site-title">Nyxoria</h1>
  <p class="site-tagline">Where dark worlds are written into being</p>
  <div class="hdr-divider">The Archive</div>
</header>

<div class="controls">
  <div class="search-wrap">
    <input class="search" type="search" id="searchInput" placeholder="Search the archive…" oninput="filter()"/>
  </div>
  <select class="genre-sel" id="genreFilter" onchange="filter()">
    <option value="">All Genres</option>
  </select>
  <span class="count" id="countLabel">— volumes</span>
  <span style="font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--mist);white-space:nowrap;">
    <span class="live-dot"></span>Live
  </span>
</div>

<div class="tag-bar" id="tagBar">
  <span class="tag-bar-label">Tags</span>
  <span class="tag-bar-empty" id="tagBarEmpty">No tags yet</span>
</div>

<main class="archive">
  <div id="stateEl">
    <div class="state">
      <span class="state-rune spinning">⸸</span>
      <p class="state-msg">Consulting the archive…</p>
    </div>
  </div>
</main>

<!-- Book Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-corner tl"></div><div class="modal-corner tr"></div>
    <div class="modal-corner bl"></div><div class="modal-corner br"></div>
    <button class="modal-close" onclick="closeModal()" title="Close">✕</button>
    <div class="modal-head" id="modalHead"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer class="site-footer">
  <span class="footer-rune">⸸</span>
  <p>Nyxoria · The Archive · All Rights Reserved</p>
  <p style="margin-top:.4rem"><a href="admin-auth.html">Keeper's Entrance</a></p>
</footer>

<script>
let allBooks = [];
let activeTag = '';
let pollTimer = null;
const POLL_INTERVAL = 15000;
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function setState(html) { document.getElementById('stateEl').innerHTML = html; }

function buildGenres(books) {
  const genres = [...new Set(books.map(b=>b.genre).filter(Boolean))].sort();
  const sel = document.getElementById('genreFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Genres</option>';
  genres.forEach(g => {
    const o = document.createElement('option');
    o.value = g; o.textContent = g;
    if (g === cur) o.selected = true;
    sel.appendChild(o);
  });
}

function buildTagBar(books) {
  const bar = document.getElementById('tagBar');
  const empty = document.getElementById('tagBarEmpty');
  const allTags = [...new Set(books.flatMap(b => b.tags||[]).filter(Boolean))].sort();

  // Remove old pills, keep label
  bar.querySelectorAll('.tag-pill').forEach(p => p.remove());
  if (!allTags.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';

  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-pill' + (tag === activeTag ? ' active' : '');
    btn.textContent = tag;
    btn.onclick = () => {
      activeTag = (activeTag === tag) ? '' : tag;
      bar.querySelectorAll('.tag-pill').forEach(p => p.classList.toggle('active', p.textContent === activeTag));
      filter();
    };
    bar.appendChild(btn);
  });
}

function filter() {
  const q     = document.getElementById('searchInput').value.toLowerCase().trim();
  const genre = document.getElementById('genreFilter').value;
  const filtered = allBooks.filter(b => {
    const mq  = !q     || b.title.toLowerCase().includes(q) || (b.genre||'').toLowerCase().includes(q)
                       || (b.tags||[]).some(t => t.toLowerCase().includes(q));
    const mg  = !genre || b.genre === genre;
    const mt  = !activeTag || (b.tags||[]).includes(activeTag);
    return mq && mg && mt;
  });
  renderGrid(filtered);
  document.getElementById('countLabel').textContent = `${filtered.length} volume${filtered.length!==1?'s':''}`;
}

function renderGrid(books) {
  if (!books.length) {
    setState(`<div class="state"><span class="state-rune">🕯</span><p class="state-msg">No volumes found.</p></div>`);
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  books.forEach((b, i) => {
    const ch   = b.chapterCount || 0;
    const tags = (b.tags||[]).slice(0,3);
    const div  = document.createElement('div');
    div.className = 'card';
    div.style.animationDelay = `${i * 0.05}s`;
    div.onclick = () => openModal(b._id);
    const cover = b.coverData
      ? `<img class="card-cover" src="${b.coverData}" alt="${esc(b.title)}" loading="lazy"/>`
      : `<div class="card-ph">⸸<span>No Cover</span></div>`;
    const tagHtml = tags.length
      ? `<div class="card-tags">${tags.map(t=>`<span class="card-tag">${esc(t)}</span>`).join('')}</div>` : '';
    div.innerHTML = `${cover}
      <div class="card-body">
        <div class="card-genre">${esc(b.genre||'—')}</div>
        <div class="card-title">${esc(b.title)}</div>
        ${tagHtml}
        <div class="card-meta">${ch} chapter${ch!==1?'s':''}</div>
        <span class="card-cta">View Chapters ✦</span>
      </div>`;
    grid.appendChild(div);
  });
  setState('');
  document.getElementById('stateEl').appendChild(grid);
}

// ── Live polling ──────────────────────────────────────────────────────────
async function fetchBooks(silent=false) {
  try {
    const res = await fetch('/api/books');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const books = await res.json();
    const sig = books.map(b => b._id+(b.updatedAt||'')).join('|');
    if (sig !== fetchBooks._lastSig) {
      fetchBooks._lastSig = sig;
      allBooks = books;
      buildGenres(books);
      buildTagBar(books);
      filter();
    }
  } catch(e) {
    if (!silent) setState(`<div class="state">
      <span class="state-rune">⸸</span>
      <p class="state-msg err">${esc(e.message)}</p>
      <button class="retry" onclick="init()">↺ Try Again</button>
    </div>`);
  }
}
fetchBooks._lastSig = '';

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => fetchBooks(true), POLL_INTERVAL);
}

async function init() {
  setState(`<div class="state"><span class="state-rune spinning">⸸</span><p class="state-msg">Consulting the archive…</p></div>`);
  await fetchBooks(false);
  startPolling();
}

// ── Modal ─────────────────────────────────────────────────────────────────
async function openModal(bookId) {
  const overlay = document.getElementById('modalOverlay');
  const head    = document.getElementById('modalHead');
  const body    = document.getElementById('modalBody');

  head.innerHTML = `<div style="padding:.5rem;color:var(--mist);font-style:italic;font-size:.85rem;">Loading…</div>`;
  body.innerHTML = '';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    const res = await fetch(`/api/books/${bookId}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const book = await res.json();
    const chapters = book.chapters || [];
    const tags     = book.tags || [];

    const coverHtml = book.coverData
      ? `<img src="${book.coverData}" alt="${esc(book.title)}"/>`
      : `<div class="modal-cover-ph">⸸</div>`;

    const pubDate = book.updatedAt
      ? new Date(book.updatedAt).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
      : null;

    const tagsHtml = tags.length
      ? `<div class="modal-tags">${tags.map(t=>`<span class="modal-tag" onclick="filterByTag('${esc(t)}')">${esc(t)}</span>`).join('')}</div>`
      : '';

    head.innerHTML = `
      <div class="modal-cover-wrap">${coverHtml}</div>
      <div class="modal-info">
        <div class="modal-genre">${esc(book.genre||'—')}</div>
        <div class="modal-title">${esc(book.title)}</div>
        <div class="modal-meta">${chapters.length} chapter${chapters.length!==1?'s':''}</div>
        ${pubDate ? `<div class="modal-published">Published ${pubDate}</div>` : ''}
        ${tagsHtml}
      </div>`;

    if (book.summary) {
      const sumDiv = document.createElement('div');
      sumDiv.className = 'modal-summary';
      sumDiv.textContent = book.summary;
      body.appendChild(sumDiv);
    }

    if (!chapters.length) {
      const p = document.createElement('p');
      p.className = 'modal-no-chap';
      p.textContent = 'No chapters written yet.';
      body.appendChild(p);
      return;
    }

    const label = document.createElement('div');
    label.className = 'chap-label';
    label.textContent = 'Choose where to begin';
    body.appendChild(label);

    const list = document.createElement('div');
    list.className = 'chap-list';
    chapters.forEach((ch, idx) => {
      const a = document.createElement('a');
      a.className = 'chap-item';
      a.href = `read.html?id=${encodeURIComponent(bookId)}&ch=${idx}`;
      a.innerHTML = `
        <span class="chap-num">${String(idx+1).padStart(2,'0')}</span>
        <span class="chap-title">${esc(ch.title||`Chapter ${idx+1}`)}</span>
        <span class="chap-arrow">→</span>`;
      list.appendChild(a);
    });
    body.appendChild(list);
  } catch(e) {
    body.innerHTML = `<p class="modal-no-chap" style="color:var(--rose)">Failed to load: ${esc(e.message)}</p>`;
  }
}

function filterByTag(tag) {
  closeModal();
  activeTag = tag;
  document.querySelectorAll('.tag-pill').forEach(p => p.classList.toggle('active', p.textContent === tag));
  filter();
  window.scrollTo({top:0,behavior:'smooth'});
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
</body>
</html>
