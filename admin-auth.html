<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter — Nyxoria Sanctum</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--void:#050407;--deep:#0d0b12;--veil:#1e1828;--ash:#2e2640;--mist:#4a3f60;--bone:#c8bfd8;--parchment:#e8dfc8;--blood:#8b1a2f;--crimson:#c41e3a;--rose:#e85d75;--gold:#c9a84c;--pale-gold:#e8d08a;--silver:#9b97b0;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--bone);font-family:'Cormorant Garamond',serif;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:1rem;overflow:hidden;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(139,26,47,.13) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 15% 80%,rgba(74,63,96,.18) 0%,transparent 55%);}
  canvas#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}

  .card{position:relative;z-index:10;width:min(420px,100%);padding:clamp(2rem,5vw,3rem);background:linear-gradient(160deg,var(--deep) 0%,#0a0910 100%);border:1px solid var(--ash);border-top:2px solid var(--blood);box-shadow:0 0 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(201,168,76,.05);animation:rise .7s cubic-bezier(.23,1.12,.62,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
  .corner{position:absolute;width:16px;height:16px;border-color:rgba(201,168,76,.25);border-style:solid;}
  .corner.tl{top:-1px;left:-1px;border-width:2px 0 0 2px;}.corner.tr{top:-1px;right:-1px;border-width:2px 2px 0 0;}.corner.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}.corner.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

  .rune{text-align:center;font-size:2.4rem;color:var(--blood);margin-bottom:1.1rem;filter:drop-shadow(0 0 18px rgba(139,26,47,.6));animation:flicker 5s ease-in-out infinite;}
  @keyframes flicker{0%,100%{opacity:1}46%{opacity:.6}50%{opacity:1}54%{opacity:.75}58%{opacity:1}}
  .title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.25rem,4vw,1.6rem);font-weight:700;text-align:center;background:linear-gradient(160deg,#fffbe8,var(--pale-gold) 50%,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem;letter-spacing:.04em;}
  .sub{font-family:'IM Fell English',serif;font-style:italic;text-align:center;color:var(--silver);font-size:.88rem;margin-bottom:1.6rem;letter-spacing:.06em;}
  .divider{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;}
  .divider::before{background:linear-gradient(to right,transparent,var(--ash));}
  .divider::after{background:linear-gradient(to left,transparent,var(--ash));}
  .divider-rune{color:var(--mist);font-size:.85rem;}

  .field{margin-bottom:1.1rem;}
  .field label{display:block;font-size:.6rem;letter-spacing:.45em;text-transform:uppercase;color:var(--silver);margin-bottom:.45rem;}
  .field input{display:block;width:100%;background:rgba(30,24,40,.9);border:1px solid var(--ash);border-bottom:2px solid var(--ash);color:var(--parchment);padding:.72rem .95rem;font-family:'Cormorant Garamond',serif;font-size:1.02rem;outline:none;transition:border-color .3s,background .3s;}
  .field input:focus{border-bottom-color:var(--gold);background:rgba(30,24,40,1);}
  .field input::placeholder{color:rgba(155,151,176,.4);}

  .error{background:rgba(139,26,47,.12);border:1px solid rgba(139,26,47,.4);border-left:3px solid var(--crimson);color:#e06070;padding:.68rem .9rem;font-size:.83rem;margin-bottom:1.1rem;display:none;font-style:italic;letter-spacing:.02em;}
  .error.show{display:block;animation:shake .35s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .btn{display:block;width:100%;background:var(--blood);border:none;color:var(--parchment);padding:.82rem;font-family:'Cinzel Decorative',serif;font-size:.78rem;letter-spacing:.3em;cursor:pointer;transition:background .3s,transform .15s;text-transform:uppercase;position:relative;overflow:hidden;}
  .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.05),transparent);pointer-events:none;}
  .btn:hover{background:var(--crimson);}
  .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn .lbl{display:block;}.btn .spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
  .btn.loading .lbl{display:none;}.btn.loading .spinner{display:block;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card-footer{margin-top:1.6rem;text-align:center;font-size:.65rem;letter-spacing:.3em;color:rgba(74,63,96,.7);text-transform:uppercase;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="card">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="rune">⸸</div>
  <h1 class="title">Nyxoria Sanctum</h1>
  <p class="sub">The author's private chambers</p>
  <div class="divider"><div class="divider-rune">✦</div></div>
  <div class="error" id="err"></div>
  <div class="field">
    <label>Identifier</label>
    <input type="text" id="username" placeholder="Your name…" autocomplete="username"/>
  </div>
  <div class="field">
    <label>Passphrase</label>
    <input type="password" id="password" placeholder="Speak the word…" autocomplete="current-password"/>
  </div>
  <button class="btn" id="btn" onclick="login()">
    <span class="lbl">Enter the Sanctum</span>
    <div class="spinner"></div>
  </button>
  <div class="card-footer">Nyxoria · The Archive</div>
</div>

<script>
if (sessionStorage.getItem('nyxoria_auth') === 'true') location.href = 'admin.html';

function login() {
  const user = document.getElementById('username').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const err  = document.getElementById('err');
  const btn  = document.getElementById('btn');
  err.classList.remove('show');
  if (user !== 'nyxoria' || pass !== 'darkness') {
    err.textContent = 'The words do not match. Entry denied.';
    err.classList.add('show');
    document.getElementById('password').value = '';
    return;
  }
  btn.disabled = true;
  btn.classList.add('loading');
  sessionStorage.setItem('nyxoria_auth', 'true');
  setTimeout(() => location.href = 'admin.html', 380);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// Starfield
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width=innerWidth; c.height=innerHeight; }
  function init(){
    stars=[];
    for(let i=0;i<140;i++) stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*.9+.2,o:Math.random(),s:Math.random()*.003+.001});
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.o+=s.s; if(s.o>1||s.o<0) s.s*=-1;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,191,216,${s.o*0.5})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();init();});
  resize(); init(); draw();
})();
</script>
</body>
</html>
